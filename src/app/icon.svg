<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">JN — Jupri Naldi</title>
  <!-- Varian A — JN Monogram Minimal | Noir Editorial -->
  <!-- Canvas 32×32, rounded 7px, noir #09090B, white JN geometric -->
  <rect width="32" height="32" rx="7" fill="#09090B"/>
  <!-- JN wordmark — geometric sans, tight tracking for 16px legibility -->
  <text
    x="50%"
    y="54%"
    dominant-baseline="middle"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Inter, 'Geist Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14.5"
    font-weight="800"
    letter-spacing="-0.035em"
    style="font-feature-settings: 'ss01' 1"
  >JN</text>
</svg>
